<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseScore MIDI Fetcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-a: #fdf6ec;
            --bg-b: #dbefff;
            --bg-c: #f6e8ff;
            --card: rgba(255, 255, 255, 0.92);
            --text: #1a2130;
            --muted: #556277;
            --line: #d8dfea;
            --accent: #0b6ed0;
            --accent-strong: #004fa6;
            --ok: #0a7f42;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 20%, var(--bg-a), transparent 35%),
                radial-gradient(circle at 88% 12%, var(--bg-b), transparent 38%),
                radial-gradient(circle at 50% 100%, var(--bg-c), transparent 42%),
                #f4f8fd;
            display: grid;
            place-items: center;
            padding: 28px 16px;
        }

        .shell {
            width: 100%;
            max-width: 740px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--card);
            box-shadow: 0 26px 70px rgba(10, 35, 70, 0.14);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .band {
            padding: 22px 24px;
            background: linear-gradient(120deg, #09315f, #0b6ed0 45%, #43a8ff);
            color: #fff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
        }

        .content {
            padding: 30px 24px 22px;
        }

        h1 {
            margin: 0;
            font-family: "Fraunces", Georgia, serif;
            font-weight: 800;
            font-size: clamp(28px, 4.8vw, 42px);
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        .sub {
            margin: 12px 0 22px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .callout {
            margin: 0 0 18px;
            padding: 12px 14px;
            border: 1px solid #bfd6f4;
            border-radius: 12px;
            background: #eef6ff;
            color: #184a82;
            font-size: 14px;
            font-weight: 600;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        input {
            min-width: 0;
            width: 100%;
            border-radius: 12px;
            border: 1px solid #c7d4e6;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #4b9eff;
            box-shadow: 0 0 0 4px rgba(75, 158, 255, 0.15);
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(180deg, var(--accent), var(--accent-strong));
            cursor: pointer;
            transition: transform 0.12s ease, opacity 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        #result {
            margin-top: 16px;
            min-height: 24px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        #result a {
            color: var(--ok);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid rgba(10, 127, 66, 0.25);
            padding-bottom: 2px;
        }

        #result a:hover {
            border-bottom-color: rgba(10, 127, 66, 0.55);
        }

        .credit {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid #e3e9f3;
            font-size: 13px;
            color: #6b778a;
        }

        @media (max-width: 620px) {
            .row {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="band">MuseScore To MIDI</div>
        <div class="content">
            <h1>Turn MuseScore Links Into MIDI Downloads</h1>
            <p class="sub">Paste any MuseScore score URL and this tool will find a downloadable MIDI file for you.</p>
            <p class="callout">This can take up to 1 minute depending on score protection and network conditions.</p>

            <div class="row">
                <input type="text" id="scoreUrl" placeholder="https://musescore.com/user/...">
                <button onclick="fetchMidi()">Get MIDI</button>
            </div>

            <div id="result"></div>
            <div class="credit">Made by Adrians Bergmanis</div>
        </div>
    </main>

    <script>
        async function fetchMidi() {
            const scoreUrl = document.getElementById('scoreUrl').value;
            const resultDiv = document.getElementById('result');
            const submitBtn = document.querySelector('button[onclick="fetchMidi()"]');
            const startedAt = Date.now();
            let timerId = null;

            const renderProgress = () => {
                const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
                resultDiv.innerText = `Searching for downloadable MIDI... please wait. (${elapsed}s)`;
            };

            if (!scoreUrl) {
                resultDiv.innerText = "Please paste a MuseScore URL first.";
                return;
            }
            
            renderProgress();
            timerId = setInterval(renderProgress, 200);
            if (submitBtn) submitBtn.disabled = true;

            try {
                const apiBase = window.MIDI_API_BASE || "";
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 70000);

                const response = await fetch(`${apiBase}/api/get-midi?scoreUrl=${encodeURIComponent(scoreUrl)}`, {
                    signal: controller.signal,
                });
                clearTimeout(timeoutId);

                const contentType = response.headers.get("content-type") || "";
                let data;
                if (contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    data = { error: text || "Server returned a non-JSON response." };
                }

                if (!response.ok) {
                    const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
                    resultDiv.innerText = "❌ Error: " + (data.error || `Request failed (${response.status})`) + ` (${elapsed}s)`;
                    return;
                }

                if (data.midiUrl) {
                    const href = data.downloadUrl || data.midiUrl;
                    const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
                    const backendMs = data.meta?.totalMs;
                    const backendSec = typeof backendMs === "number" ? (backendMs / 1000).toFixed(1) : null;
                    const timingText = backendSec ? `Client ${elapsed}s, API ${backendSec}s` : `Client ${elapsed}s`;
                    resultDiv.innerHTML = `<a href="${href}" target="_blank" rel="noopener">Download MIDI File</a><div style="margin-top:8px;font-size:12px;color:#555;">${timingText}</div>`;
                } else {
                    const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
                    resultDiv.innerText = "❌ Error: " + (data.error || "Could not find MIDI.") + ` (${elapsed}s)`;
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
                    resultDiv.innerText = `❌ Request timed out. Please try again. (${elapsed}s)`;
                } else {
                    const elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
                    resultDiv.innerText = `❌ Failed to connect to server. (${elapsed}s)`;
                }
            } finally {
                if (timerId) clearInterval(timerId);
                if (submitBtn) submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
