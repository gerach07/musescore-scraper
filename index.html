<!DOCTYPE html>
<html lang="en">
<head>
    <title>MuseScore MIDI Fetcher</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        input { padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>MuseScore MIDI Link Grabber</h1>
    <p>Paste the MuseScore URL below:</p>
    
    <input type="text" id="scoreUrl" placeholder="https://musescore.com/user/...">
    <button onclick="fetchMidi()">Get MIDI</button>

    <div id="result"></div>

    <script>
        async function fetchMidi() {
            const scoreUrl = document.getElementById('scoreUrl').value;
            const resultDiv = document.getElementById('result');
            const submitBtn = document.querySelector('button[onclick="fetchMidi()"]');

            if (!scoreUrl) {
                resultDiv.innerText = "Please paste a MuseScore URL first.";
                return;
            }
            
            resultDiv.innerText = "Searching for downloadable MIDI... please wait.";
            if (submitBtn) submitBtn.disabled = true;

            try {
                const apiBase = window.MIDI_API_BASE || "";
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 70000);

                const response = await fetch(`${apiBase}/api/get-midi?scoreUrl=${encodeURIComponent(scoreUrl)}`, {
                    signal: controller.signal,
                });
                clearTimeout(timeoutId);

                const contentType = response.headers.get("content-type") || "";
                let data;
                if (contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    data = { error: text || "Server returned a non-JSON response." };
                }

                if (!response.ok) {
                    resultDiv.innerText = "❌ Error: " + (data.error || `Request failed (${response.status})`);
                    return;
                }

                if (data.midiUrl) {
                    const href = data.downloadUrl || data.midiUrl;
                    resultDiv.innerHTML = `<a href="${href}" target="_blank" rel="noopener">Download MIDI File</a>`;
                } else {
                    resultDiv.innerText = "❌ Error: " + (data.error || "Could not find MIDI.");
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    resultDiv.innerText = "❌ Request timed out. Please try again.";
                } else {
                    resultDiv.innerText = "❌ Failed to connect to server.";
                }
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
